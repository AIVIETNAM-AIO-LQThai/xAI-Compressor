# Syrus diagnostic tests. Draft – needs domain review.
#
# Each test names the candidate pairs it compares, the observations it needs and where each
# observation lives, its maturity, its rule and its result. Follow-up questions come only from
# this table. Documents may explain why an observation discriminates; they may not add
# candidates, tests or results.
#
# Semantics (ledger revision, docs/syrus/LEDGER_REVIEW.md):
# - availability says where an observation lives, not whether a test used it;
# - draft -> reviewed only through domain review, with the rule committed before it is run on any case;
#   the rule states the expected interpretation and the scope of its result;
# - raw_dataset -> loaded only after raw-data approval and the reproduction check;
# - a result other than not_run needs a reviewed rule run over loaded observations;
# - a pair is not separable with this data when every test comparing it needs an external observation;
# - candidates stay `open`; supports/weakens belong to a test result and name its scope, never confirm.
# Cross-layer pairs appear only where two accounts compete for the same evidence.
version: 2
status: draft – needs domain review

availability:
  loaded: {en: "in this case's loaded evidence", vi: "có trong bằng chứng đã nạp của ca này"}
  raw_dataset: {en: "in the raw MetroPT-3 telemetry, not loaded", vi: "có trong dữ liệu thô MetroPT-3, chưa được nạp"}
  external: {en: "not recorded in MetroPT-3; needs an outside observation", vi: "không được ghi nhận trong MetroPT-3; cần một quan sát từ bên ngoài"}

maturity:
  draft: {en: "draft: observation named, no reviewed rule", vi: "bản nháp: đã nêu quan sát, chưa có quy tắc được thẩm định"}
  reviewed: {en: "reviewed rule, committed before it was run", vi: "quy tắc đã được thẩm định, cam kết trước khi chạy"}

results:
  not_run: {en: not run, vi: chưa chạy}
  inconclusive: {en: inconclusive, vi: chưa đủ để kết luận}
  supports: {en: supports, vi: ủng hộ}
  weakens: {en: weakens, vi: làm suy yếu}

candidate_status:
  open: {en: "open: not resolved by a reviewed test; not ranked, not equally likely", vi: "để ngỏ: chưa được kiểm định nào phân giải; không xếp hạng, không có nghĩa là khả năng ngang nhau"}

pair_limits:
  not_separable: {en: "cannot be told apart with MetroPT-3 data", vi: "không phân biệt được với dữ liệu MetroPT-3"}

tests:
  - id: t_demand_record
    compares: [[air_leakage, downstream_demand]]
    observations:
      - availability: external
        text:
          en: An independent record of downstream air use, such as a flow meter or consumer-demand log, for the same period.
          vi: Một bản ghi độc lập về lượng khí sử dụng phía hạ nguồn, như đồng hồ lưu lượng hoặc nhật ký nhu cầu của thiết bị tiêu thụ, trong cùng khoảng thời gian.
    maturity: draft
    rule: null
    result: not_run
    follow_up:
      en: Do you have any independent record of downstream air use for this period, such as a flow meter or a consumer-demand log?
      vi: Bạn có bản ghi độc lập nào về lượng khí sử dụng phía hạ nguồn trong khoảng thời gian này không, chẳng hạn đồng hồ lưu lượng hoặc nhật ký nhu cầu của thiết bị tiêu thụ?

  - id: t_cycle_pattern
    compares:
      - [pressure_regulation, air_leakage]
      - [pressure_regulation, downstream_demand]
      - [pressure_regulation, normal_operating_change]
    observations:
      - availability: raw_dataset
        text:
          en: Compressor load/unload cycle durations and pressure-switch activity in the hours before the alert.
          vi: Độ dài chu kỳ có tải/không tải của máy nén và hoạt động của công tắc áp suất trong vài giờ trước cảnh báo.
    maturity: draft
    rule: null
    result: not_run
    follow_up:
      en: Do you know whether the compressor's load/unload cycling changed in the hours before this alert?
      vi: Bạn có biết chu kỳ có tải/không tải của máy nén có thay đổi trong vài giờ trước cảnh báo này không?

  - id: t_sensor_agreement
    compares:
      - [sensor_problem, air_leakage]
      - [sensor_problem, downstream_demand]
      - [sensor_problem, pressure_regulation]
      - [sensor_problem, compressor_performance]
    observations:
      - availability: raw_dataset
        text:
          en: Agreement between related pressure signals (TP2, TP3 and reservoirs) over the same bins.
          vi: Mức độ khớp nhau giữa các tín hiệu áp suất liên quan (TP2, TP3 và bình chứa) trong cùng các khoảng thời gian.
    maturity: draft
    rule: null
    result: not_run
    follow_up:
      en: Were the related pressure sensors (TP2, TP3, reservoirs) checked against each other or recalibrated around this time?
      vi: Các cảm biến áp suất liên quan (TP2, TP3, bình chứa) có được đối chiếu với nhau hoặc hiệu chuẩn lại vào khoảng thời gian này không?

  - id: t_load_response
    compares:
      - [compressor_performance, air_leakage]
      - [compressor_performance, downstream_demand]
    observations:
      - availability: raw_dataset
        text:
          en: Pressure rise per loaded minute compared with motor current.
          vi: Mức tăng áp suất trên mỗi phút chạy có tải so với dòng điện động cơ.
    maturity: draft
    rule: null
    result: not_run
    follow_up:
      en: Is there any record of how quickly the compressor built pressure while loaded around this time?
      vi: Có bản ghi nào cho biết máy nén tăng áp nhanh hay chậm khi chạy có tải vào khoảng thời gian này không?

  - id: t_raw_persistence
    compares:
      - [normal_operating_change, air_leakage]
      - [normal_operating_change, downstream_demand]
      - [normal_operating_change, compressor_performance]
    observations:
      - availability: raw_dataset
        text:
          en: Whether the raw anomaly score stays high over many bins or is confined to one or two bins.
          vi: Điểm bất thường thô duy trì ở mức cao qua nhiều khoảng thời gian hay chỉ nằm trong một hai khoảng.
    maturity: draft
    rule: null
    result: not_run
    follow_up:
      en: Do you have any information on whether this behaviour lasted many cycles or appeared only briefly?
      vi: Bạn có thông tin nào cho thấy hiện tượng này kéo dài nhiều chu kỳ hay chỉ xuất hiện trong thời gian ngắn không?

  - id: t_bin_coverage
    compares:
      - [data_quality, sensor_problem]
      - [data_quality, reference_coverage]
    observations:
      - availability: raw_dataset
        text:
          en: Row coverage and missing samples for each signal in the five-minute bins around the alert.
          vi: Độ phủ số dòng và số mẫu bị thiếu của từng tín hiệu trong các khoảng năm phút quanh thời điểm cảnh báo.
    maturity: draft
    rule: null
    result: not_run
    follow_up:
      en: Do you know of any data-logging problem around this time, such as missing records or a logger restart?
      vi: Bạn có biết sự cố ghi dữ liệu nào vào khoảng thời gian này không, như thiếu bản ghi hoặc bộ ghi khởi động lại?

  - id: t_reference_occurrence
    compares:
      - [reference_coverage, sensor_problem]
      - [reference_coverage, data_quality]
    observations:
      - availability: raw_dataset
        text:
          en: How often the operating state at the alert (pressure level and load/unload pattern) occurred in the training and calibration weeks.
          vi: Trạng thái vận hành tại thời điểm cảnh báo (mức áp suất và kiểu có tải/không tải) xuất hiện thường xuyên đến đâu trong các tuần huấn luyện và hiệu chuẩn.
    maturity: draft
    rule: null
    result: not_run
    follow_up:
      en: Was the train operating differently around this time than in February 2020, for example after maintenance, a long stop or a different service pattern?
      vi: Vào khoảng thời gian này, tàu có vận hành khác so với tháng 2/2020 không, chẳng hạn sau bảo dưỡng, sau một lần dừng lâu hoặc theo lịch chạy khác?
