dataset:
  name: IITK Air Compressor Health State Dataset
  short_name: IITK-AirCompressor
  source: Indian Institute of Technology Kanpur
  source_page: "https://www.iitk.ac.in/idea/datasets/"
  citation:
    title: "Intelligent Condition Based Monitoring using Acoustic Signals for Air Compressors"
    authors:
      - Nishchal K. Verma
      - R. K. Sevakula
      - S. Dixit
      - A. Salour
    journal: "IEEE Transactions on Reliability"
    volume: 65
    number: 1
    pages: "291-309"
    year: 2016
    doi: "10.1109/TR.2015.2459684"

  raw_zip: "data/raw/iitk_air_compressor/AirCompressor_Data.zip"
  archive_root: "AirCompressor_Data"

  conditions:
    healthy: "Healthy"
    faults:
      bearing: "Bearing"
      flywheel: "Flywheel"
      leakage_inlet_valve: "LIV"
      leakage_outlet_valve: "LOV"
      non_return_valve: "NRV"
      piston_ring: "Piston"
      rider_belt: "Riderbelt"

  readings_per_condition: 225
  samples_per_recording: 50000

  sample_rate_hz: null
  sample_rate_status: "unverified_for_preprocessed_dat_files"
  absolute_frequency_features: false

audit:
  report_file: "docs/iitk_air_compressor_data_audit.json"

preprocessing:
  output_file: "data/processed/iitk_air_compressor/features.parquet"
  report_file: "docs/iitk_air_compressor_preprocessing_report.json"

  healthy_split:
    train:
      first_reading: 1
      last_reading: 120
    calibration:
      first_reading: 121
      last_reading: 180
    test:
      first_reading: 181
      last_reading: 225

  fault_split: "test_only"

  feature_protocol:
    signal_center_for_spectrum: "subtract_recording_mean"
    spectral_window: "hann"
    frequency_axis: "fraction_of_nyquist"
    spectral_band_edges:
      - 0.000
      - 0.125
      - 0.250
      - 0.375
      - 0.500
      - 0.625
      - 0.750
      - 0.875
      - 1.000

external_validation:
  role: "independent_cross_asset_cross_modality_representation_stress_test"
  output_file: "docs/iitk_air_compressor_external_benchmark.json"

  candidate_representations:
    robust_pca:
      family: "pca_reconstruction"
      scaler: "robust"
      variance_retained: 0.95

    standard_pca:
      family: "pca_reconstruction"
      scaler: "standard"
      variance_retained: 0.95

    robust_feature_energy:
      family: "feature_energy"
      scaler: "robust"

    standard_feature_energy:
      family: "feature_energy"
      scaler: "standard"

  alert_temporal_logic: false

  threshold_quantile: 0.95
  threshold_interpolation: "higher"

  primary_metrics:
    - roc_auc
    - average_precision
    - heldout_healthy_false_positive_rate
    - overall_fault_recall
    - balanced_accuracy
    - macro_fault_recall
    - per_fault_recall
    - per_fault_roc_auc

  explanation_metrics:
    - top1_concentration
    - top3_concentration
    - normalized_entropy
    - effective_group_count
    - herfindahl_index

  interpretation_guardrails:
    - "IITK is a recording-level seeded-fault benchmark, not a temporal precursor benchmark."
    - "Global average precision has a high prevalence baseline because 1575 of 1620 test recordings are faults."
    - "Per-fault ROC-AUC against the same 45 held-out healthy recordings is a primary class-wise ranking check."
    - "Explanation groups are five acoustic feature families; raw N_eff is not directly comparable to MetroPT sensor-group N_eff."
    - "Feature-family contribution is detector evidence, not physical root cause."
    - "No detector or representation is promoted from this exploratory research branch."
