# Syrus candidate-explanation catalog (D6). Draft – needs domain review.
# Separate from the frozen configs/waste_hypotheses.yaml, which stays unchanged.
#
# Two layers that can hold at the same time:
# - process: what may have changed in the machine or its air system;
# - evidence: why the data or the detector may show anomaly evidence without that change.
# Every candidate is listed for every case, in this file's order, which is not a ranking.
# A candidate's status is `open` until a reviewed test in configs/syrus_discriminators.yaml
# returns a result. Open means unresolved, not equally likely. Contribution shares, ranks,
# repairs, the provider's label and operator statements never change a status.
# `groups` lists the signal groups a candidate relates to (`any`: no specific group); it is
# shown next to the candidate and never puts a candidate in or out of a case.
#
# Changes from the frozen catalog:
# - "persistent" is dropped: no deterministic rule establishes persistence;
# - "process-demand surge" becomes downstream air demand;
# - degradation and unloaded operation merge into one compressor-performance candidate;
# - excess-pressure operation is left out: it is an energy-waste opportunity, not an alert explanation.
# Changes from version 1 (ledger revision, docs/syrus/LEDGER_REVIEW.md):
# - candidates carry a layer, and the evidence-gated "in play" filter is removed;
# - "benign operating transient" becomes normal operating change;
# - "detector artifact" is replaced by reference-coverage gap; smoothing memory is a finding, not a candidate;
# - data-quality effect is added; sensor inconsistency becomes sensor or measurement problem.
version: 2
status: draft – needs domain review

layers:
  process: {en: Process, vi: Quá trình}
  evidence: {en: Evidence, vi: Bằng chứng}

hypotheses:
  - id: air_leakage
    layer: process
    label: {en: Air leakage, vi: Rò rỉ khí}
    description:
      en: Air leaves the system through a leak, raising total outflow. Detector evidence alone cannot separate this from higher downstream demand.
      vi: Khí thoát ra ngoài qua chỗ rò, làm tăng tổng lưu lượng khí ra. Chỉ dựa vào bằng chứng của bộ phát hiện thì không tách được khả năng này với nhu cầu khí phía hạ nguồn tăng.
    groups: [dv_pressure, tp2, pressure_relationships]
    frozen_ids: [leak_like_persistent_outflow]
    # The provider's label wording that names this candidate. A claim stating that label may use the candidate's name without
    # citing the candidate record (in Vietnamese the label "air leak" and this candidate share the words "rò rỉ khí").
    label_conditions: [air_leak_high_stress]

  - id: downstream_demand
    layer: process
    label: {en: Higher downstream air demand, vi: Nhu cầu khí phía hạ nguồn tăng}
    description:
      en: Legitimate air use downstream rose, raising total outflow in a way that can look like leakage.
      vi: Lượng khí sử dụng hợp lệ ở phía hạ nguồn tăng, làm tăng tổng lưu lượng khí ra theo cách có thể trông giống rò rỉ.
    groups: [dv_pressure, tp2, pressure_relationships]
    frozen_ids: [demand_surge]

  - id: pressure_regulation
    layer: process
    label: {en: Pressure-regulation behaviour, vi: Bất thường trong điều tiết áp suất}
    description:
      en: Pressure control, load/unload cycling or switching behaved differently from the training period, rather than outflow changing.
      vi: Cơ chế điều áp, chu kỳ có tải/không tải hoặc đóng cắt hoạt động khác với giai đoạn huấn luyện, thay vì lưu lượng khí ra thay đổi.
    groups: [dv_pressure, pressure_relationships, pressure_switch, comp]
    frozen_ids: [pressure_regulation_instability]

  - id: compressor_performance
    layer: process
    label: {en: Compressor performance change, vi: Thay đổi hiệu suất máy nén}
    description:
      en: The compressor's electrical effort or operating behaviour does not match the pressure response, as with wear or running without useful output.
      vi: Mức tiêu thụ điện hoặc cách vận hành của máy nén không tương xứng với đáp ứng áp suất, ví dụ do hao mòn hoặc chạy mà không tạo ra khí hữu ích.
    groups: [motor_current, tp2, tp3, reservoirs, comp, pressure_switch, caudal_impulses]
    frozen_ids: [compressor_performance_degradation, unloaded_or_inefficient_operation]

  - id: normal_operating_change
    layer: process
    label: {en: Normal operating change, vi: Thay đổi vận hành bình thường}
    description:
      en: The machine went through a normal change, such as a start, stop, load change or dryer-tower switch, with no fault.
      vi: Máy trải qua một thay đổi vận hành bình thường, như khởi động, dừng, thay đổi tải hoặc chuyển tháp sấy, mà không có lỗi.
    groups: any
    frozen_ids: []

  - id: sensor_problem
    layer: evidence
    label: {en: Sensor or measurement problem, vi: Lỗi cảm biến hoặc phép đo}
    description:
      en: A signal disagrees with related measurements because of measurement error, drift or sensor failure, rather than a change in the machine.
      vi: Một tín hiệu không khớp với các phép đo liên quan do sai số đo, trôi hoặc hỏng cảm biến, chứ không phải do máy thay đổi.
    groups: [tp2, tp3, reservoirs, dv_pressure, pressure_relationships]
    frozen_ids: [sensor_inconsistency]

  - id: data_quality
    layer: evidence
    label: {en: Data-quality effect, vi: Ảnh hưởng của chất lượng dữ liệu}
    description:
      en: Missing or partial samples within the five-minute bins, or missed digital transitions, shift the engineered features without any change in the machine. A bin needs 80% row coverage overall, which does not check each sensor separately.
      vi: Mẫu bị thiếu hoặc không đầy đủ trong các khoảng năm phút, hoặc các lần chuyển trạng thái số bị bỏ sót, làm lệch các đặc trưng mà máy không hề thay đổi. Mỗi khoảng chỉ cần đủ 80% số dòng tính chung, nên không kiểm tra riêng từng cảm biến.
    groups: any
    frozen_ids: []

  - id: reference_coverage
    layer: evidence
    label: {en: Reference-coverage gap, vi: Dữ liệu tham chiếu không bao phủ trạng thái này}
    description:
      en: The operating state at the alert was rare or absent in the training and calibration weeks (February 2020), so the detector has no reference for it; the evidence then reflects the reference's limits more than a change in the machine.
      vi: Trạng thái vận hành tại thời điểm cảnh báo hiếm gặp hoặc không có trong các tuần huấn luyện và hiệu chuẩn (tháng 2/2020), nên bộ phát hiện không có mốc tham chiếu cho trạng thái đó; khi ấy bằng chứng phản ánh giới hạn của dữ liệu tham chiếu nhiều hơn là một thay đổi của máy.
    groups: any
    frozen_ids: []
