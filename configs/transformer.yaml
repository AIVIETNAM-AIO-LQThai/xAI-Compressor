temporal:
  sequence_length: 12
  scaler: robust

model:
  d_model: 128
  nhead: 4
  num_layers: 3
  dim_feedforward: 256
  dropout: 0.10
  max_sequence_length: 64

training:
  seed: 42
  epochs: 80
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  huber_delta: 1.0
  validation_fraction: 0.15
  patience: 10
  min_delta: 0.00001
  device: auto

outputs:
  checkpoint_file: "artifacts/detection/transformer_forecaster.pt"
  scores_file: "data/processed/transformer_detector_scores.parquet"
  benchmark_file: "docs/transformer_detector_benchmark.json"
