# Syrus case registry.
# Case IDs are opaque and stable; they are never derived from incident numbers.
# Case lists are ordered by alert time, not by this file's order.
version: 1

asset:
  dataset: MetroPT-3
  asset: metro air-production unit (APU) compressor
  service: metro
  period: "2020"

# Groups below this share of the smoothed score are not displayed or given records.
display_floor: 0.01
# Groups that put a hypothesis in play need at least this share and calibration percentile.
evidence_rule:
  min_share: 0.01
  min_percentile: 0.90
# Presentation convention: an alert whose smoothed margin over the threshold is below this is called marginal.
# Frozen margins are 11.4%, 19.9%, 81.7% and 240.9%, so any cut between 20% and 81% gives the same split.
marginal_margin: 0.5

cases:
  - id: c-r6tq
    source: {type: documented_incident, incident_id: 1}
    role: null
  - id: c-h3vz
    source: {type: documented_incident, incident_id: 2}
    role: featured
  - id: c-w8nk
    source: {type: documented_incident, incident_id: 3}
    role: contrast
  - id: c-b5xm
    source: {type: documented_incident, incident_id: 4}
    role: null
